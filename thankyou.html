<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | Effizie Hotel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    animation:fadeIn 1s ease;
}

.checkmark{
    font-size:80px;
    color:#ff4fa3;

    animation:bounce 1.5s infinite;
}

h1{
    margin-top:20px;
    color:#ff4fa3;
}

p{
    margin-top:15px;
    line-height:1.7;
}

.btn{
    display:inline-block;

    margin-top:30px;

    padding:12px 30px;

    background:#ff4fa3;
    color:white;

    text-decoration:none;
    border-radius:30px;

    transition:0.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="checkmark">✓</div>

    <h1>Message Sent Successfully!</h1>

    <p>
        Thank you for contacting Effizie Hotel.<br>
        Our team will get back to you as soon as possible.
    </p>

    <a href="index.html" class="btn">
        Return Home
    </a>

</div>

</body>
</html>
