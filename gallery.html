<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Effizie Hotel offers luxury rooms, comfort, and premium hospitality in Nigeria. Book your stay today.">
<link rel="icon" type="image/png" href="logo.png">
<title>Gallery | Effizie Hotel</title>

<style>
/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:#fff;
}

/* =========================
   NAVBAR
========================= */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#ff4fa3;
    position:sticky;
    top:0;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:70px;
    height:70px;
    object-fit:contain;
    border-radius:10px;
}

.logo span{
    color:#000000;
    font-size:1.5rem;
    font-weight:bold;
    font-family: "sacremento", cursive;
}

nav a{
    color: black;
    text-decoration:none;
    margin-left:15px;
}

nav a:hover{
    color:#fac0c0;
}

.hamburger{
    display:none;
    font-size:30px;
    cursor:pointer;
    color:#000000;
    z-index: 1100;
}

/* MOBILE */
@media(max-width:768px){

    .hamburger{
        display:block;
    }

    nav{
        position:fixed;
        top:0;
        right:-260px;

        width:250px;
        height:100vh;

        background:#ff4fa3;

        display:flex;              /* IMPORTANT */
        flex-direction:column;     /* IMPORTANT */

        z-index: 1000;

        padding:80px 20px;
        gap:20px;                  /* spacing between links */

        box-shadow:-5px 0 20px rgba(0,0,0,0.2);

        transition:0.4s ease;
    }

    nav a{
        color:#111;
        font-size:18px;

        padding:12px 10px;
        border-bottom:1px solid rgba(255,255,255,0.3);
    }

    nav.active{
        right:0;
    }
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    opacity:0;
    visibility:hidden;

    transition:0.3s;
    z-index:900;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}
/* =========================
   HERO
========================= */

.hero{
    height:40vh;
    background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url("assets/gallery-banner.png");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    color:#ff4fa3;
    font-size:3rem;
}

/* =========================
   GALLERY GRID
========================= */

.gallery{
    padding:60px 8%;
    text-align:center;
}

.gallery h2{
    color:#ff4fa3;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.grid img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    transition:0.3s;
}

.grid img:hover{
    transform:scale(1.05);
    filter:brightness(1.2);
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:20px;
    background:black;
    margin-top:40px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){
    .hero h1{
        font-size:2rem;
    }
}
</style>

</head>

<body>

<!-- NAVBAR -->
<!-- NAVBAR -->
<header>

    <div class="logo">
        <img src="logo.png" alt="Effizie Hotel Logo">
        <span>EFFIZIE HOTEL</span>
    </div>

    <div class="hamburger" onclick="toggleMenu()">
        ☰
    </div>

    <div class="overlay" onclick="toggleMenu()"></div>

    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<!-- HERO -->
<section class="hero">
    <h1>Hotel Gallery</h1>
</section>

<!-- GALLERY -->
<section class="gallery">

    <h2>Explore Our Hotel</h2>

    <div class="grid">

        <img src="assets/H lobby.png" alt="Hotel Lobby">
        <img src="assets/room 5.jpg" alt="Luxury Room">
        <img src="assets/room 6.jpg" alt="Standard Room">
        <img src="assets/room 4.jpg" alt="Standard Room">
        <img src="assets/bar.jpg" alt="bar">
        <img src="assets/reception.jpg" alt="Reception Desk">
        <img src="assets/waitress.jpg" alt="Waitress">
        <img src="assets/waitress 1.jpg" alt="Waitress">


    </div>

</section>

        <script>
function toggleMenu(){
    document.getElementById("navMenu").classList.toggle("active");
    document.querySelector(".overlay").classList.toggle("active");
}
</script>

<!-- FOOTER -->
<footer>
    <p>© 2026 Effizie Hotel. All Rights Reserved.</p>
</footer>

</body>
</html>
